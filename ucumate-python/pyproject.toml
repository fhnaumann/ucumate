[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ucumate"
version = "1.0.8"
description = "Python bindings for ucumate-core — UCUM validation, canonicalization, conversion, and more"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Felix Naumann", email = "fhnaumann@t-online.de" },
]
keywords = ["ucum", "units", "units-of-measure", "healthcare", "fhir", "conversion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Java",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "JPype1>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/fhnaumann/ucumate"
Repository = "https://github.com/fhnaumann/ucumate"
Issues = "https://github.com/fhnaumann/ucumate/issues"
Documentation = "https://fhnaumann.github.io/ucumate/"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ucumate"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ucumate",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

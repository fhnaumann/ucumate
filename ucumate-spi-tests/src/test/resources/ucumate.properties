# Test properties file to see if they are correctly picked up by ucumate-core
ucumate.ucumVersion.supported=2.2,2.1
ucumate.ucumVersion.default=2.2
# ucumate.enablePrefixOnNonMetricUnits=true # Commented out to simulate missing property
ucumate.enableMolMassConversion=false
ucumate.allowAnnotAfterParens=false
# requires ucumate-persistence-module if enabled
ucumate.persistence.sqlite.enable=true
ucumate.persistence.sqlite.dbpath=${user.dir}/ucumate.db

# # # # # # # # # #
# Cache Settings  #
# # # # # # # # # #
ucumate.cache.enable=true
ucumate.cache.maxCanonSize=20000
ucumate.cache.maxValSize=20000
ucumate.cache.recordStats=true
ucumate.cache.preheat=false
ucumate.cache.preheat.override=false
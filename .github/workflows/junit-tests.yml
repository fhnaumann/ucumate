name: Run JUnit Tests

on:
  push:
    branches:
      - main
    paths:
      - 'ucumate-java/**'
      - 'ucumate-port-parity/**'
      - '.github/workflows/junit-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ucumate-java/**'
      - 'ucumate-port-parity/**'
      - '.github/workflows/junit-tests.yml'
jobs:
  junit-tests:
    permissions:
      id-token: write
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Run Functional Tests
        run: mvn -f ucumate-java/pom.xml test -Dgroups=!functional-tests # skip functional tests, they have their own workflow
      - name: Report Unit Tests
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: true

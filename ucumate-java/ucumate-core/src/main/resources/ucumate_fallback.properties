ucumate.ucumVersion=2.2
# Should probably be switched to false as default but that breaks some functional tests currently
ucumate.enablePrefixOnNonMetricUnits=true
ucumate.enableMolMassConversion=true
ucumate.allowAnnotAfterParens=true
# requires ucumate-persistence-module if enabled
ucumate.persistence.sqlite.enable=false
ucumate.persistence.sqlite.dbpath=${user.dir}/ucumate.db

# # # # # # # # # #
# Cache Settings  #
# # # # # # # # # #
ucumate.cache.enable=true
ucumate.cache.maxCanonSize=10000
ucumate.cache.maxValSize=10000
ucumate.cache.recordStats=false
ucumate.cache.preheat=true
ucumate.cache.preheat.override=false

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# Input Limits                                                            #
# Inputs exceeding these limits are rejected with a failure result        #
# instead of causing unbounded computation time or a StackOverflowError.  #
# Set ucumate.limits.enable=false to process any input regardless of cost. #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
ucumate.limits.enable=true
# Annotation text ({...}) does not count towards the length
ucumate.limits.maxUnitLength=1000
# Sum of the absolute exponents of all components (a component without an exponent counts as 1)
ucumate.limits.maxTotalExponent=300
# Digits of the value when written without scientific notation
ucumate.limits.maxValueDigits=1000
